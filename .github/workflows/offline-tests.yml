name: Offline checks

on:
  push:
  pull_request:

# Offline tests only need to read the repository.
permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install C++ JSON development headers
        run: sudo apt-get update -qq && sudo apt-get install -y nlohmann-json3-dev cmake ninja-build
      - name: Build C++ control broker (no Kinect hardware)
        run: bash tools/build_broker.sh
      - name: Native SensorBackend tests (mock sysfs, no Kinect)
        run: ./bin/test_sensor_backend
      - name: Native RAII USB session tests (fake backend, no Kinect)
        run: ./bin/test_device_session
      - name: Validate pinned source bootstrap shell syntax
        run: bash -n tools/bootstrap_libfreenect2_omp.sh
      - name: Native RGB sequence gap tracker tests
        run: ./bin/test_sequence_gap_tracker
      - name: Native automatic subscription capture lifecycle tests (mock USB)
        run: ./bin/test_auto_capture
      - name: Native supervised worker lifecycle tests
        run: ./bin/test_worker_process "$PWD/bin/kinect2-worker"
      - name: Native four-client frame fanout (mock frame bytes, no Kinect)
        run: ./bin/test_frame_hub
      - name: Native RGB BGRX to V4L2 YUYV conversion and fanout
        run: ./bin/test_v4l2_rgb
      - name: Python unit tests and C++ broker IPC integration
        env:
          KINECT2_BROKER_BIN: ${{ github.workspace }}/bin/kinect2-broker
          KINECT2_WORKER_BIN: ${{ github.workspace }}/bin/kinect2-worker
        run: python -m unittest discover -s tests -v
      - name: Body tracking mask reference (synthetic, CPU-only)
        run: python -m unittest discover -s research/body-tracking/mask-reference -p 'test_*.py' -v
      - name: Optional Kinect audio profile tests (mock PulseAudio)
        run: python -m unittest discover -s tests -p test_audio_profiles.py -v
      - name: Bash syntax
        run: bash -n kinect2 face3d webcam/*.sh tools/build_broker.sh tools/libfreenect2_path.sh tools/run_broker_service.sh tools/install_broker_user.sh tools/install_kinect2.sh
      - name: Validate public tree
        run: python tools/check_public_tree.py

  vulkan-mask-reference:
    name: Vulkan mask parity (Mesa lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Vulkan software ICD and shader build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools g++
      - name: Compile and validate independent SPIR-V shader
        run: |
          mkdir -p /tmp/kinect2-vulkan-mask
          glslangValidator -V --target-env vulkan1.0 -S comp \
            -o /tmp/kinect2-vulkan-mask/tile_mask.spv \
            research/body-tracking/vulkan-tile-mask/tile_mask.comp
          spirv-val --target-env vulkan1.0 /tmp/kinect2-vulkan-mask/tile_mask.spv
      - name: Build standalone Vulkan runner
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            research/body-tracking/vulkan-tile-mask/vulkan_tile_mask_runner.cpp \
            -lvulkan -o /tmp/kinect2-vulkan-mask/run
      - name: Compare six Vulkan results with Python CPU reference
        env:
          KINECT2_VULKAN_RUNNER: /tmp/kinect2-vulkan-mask/run
          KINECT2_VULKAN_SHADER: /tmp/kinect2-vulkan-mask/tile_mask.spv
        run: |
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$LVP_ICD" ]; then
            echo "Mesa lavapipe Vulkan ICD not installed" >&2
            exit 1
          fi
          export VK_ICD_FILENAMES="$LVP_ICD"
          python3 -m unittest discover -s research/body-tracking/vulkan-tile-mask -p 'test_*.py' -v
