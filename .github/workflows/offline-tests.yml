name: Offline checks

on:
  push:
  pull_request:

# Offline tests only need to read the repository.
permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Python unit tests (no Kinect)
        run: python -m unittest discover -s tests -v
      - name: Bash syntax
        run: bash -n kinect2 face3d webcam/*.sh
      - name: Validate public tree
        run: python tools/check_public_tree.py
